<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanzplaner</title>

<!-- App-Installation -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6fed">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- Design -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>

<!-- Anmeldung -->
<div id="login" class="hide">
  <h1>💶 Finanzplaner</h1>
  <div class="card">
    <h2>Anmelden oder registrieren</h2>
    <input id="em" type="email" autocomplete="email" placeholder="E-Mail">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Passwort (mind. 6 Zeichen)">
    <div class="two">
      <button class="p" onclick="signIn()">Anmelden</button>
      <button class="p second" onclick="signUp()">Registrieren</button>
    </div>
    <div class="err" id="lerr"></div>
  </div>
</div>

<!-- App -->
<div id="app" class="hide">
  <div class="top">
    <h1>💶 Finanzplaner</h1>
    <button onclick="auth.signOut()">Abmelden</button>
  </div>

  <div class="nav">
    <button onclick="shift(-1)" aria-label="Voriger Monat">‹</button>
    <b id="mlabel"></b>
    <button onclick="shift(1)" aria-label="Nächster Monat">›</button>
  </div>

  <div class="sum">
    <div><small>Einnahmen</small><strong class="in" id="sin"></strong></div>
    <div><small>Ausgaben</small><strong class="ex" id="sex"></strong></div>
    <div><small>Saldo</small><strong id="sbal"></strong></div>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="seg">
      <button id="bEx" class="on" onclick="setType('Ausgabe')">Ausgabe</button>
      <button id="bIn" onclick="setType('Einnahme')">Einnahme</button>
    </div>
    <input id="amt" type="text" inputmode="decimal" placeholder="Betrag in € (z. B. 12,50)">
    <select id="cat"></select>
    <input id="dat" type="date">
    <input id="note" type="text" placeholder="Notiz (optional)">
    <button class="p" onclick="add()">Hinzufügen</button>
    <div class="err" id="aerr"></div>
  </div>

  <div class="card"><h2>Ausgaben nach Kategorie</h2><div id="cats"></div></div>
  <div class="card"><h2>Buchungen</h2><div id="list"></div></div>
</div>

</main>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Funktionen -->
<script src="app.js"></script>
</body>
</html>
