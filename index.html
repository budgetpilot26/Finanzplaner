<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanzplaner</title>

<!-- App-Installation -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a4c8a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- Schriften und Design -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>

<!-- Anmeldung -->
<div id="login" class="hide">
  <h1>Finanzplaner</h1>
  <div class="card" style="margin-top:14px">
    <h2>Anmelden oder registrieren</h2>
    <p class="s">Mit deinem Konto sind deine Daten auf Handy und Laptop gleich.</p>
    <label for="em">E-Mail</label>
    <input id="em" type="email" autocomplete="email">
    <label for="pw">Passwort (mind. 6 Zeichen)</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="two">
      <button class="btn" onclick="signIn()">Anmelden</button>
      <button class="btn ghost" onclick="signUp()">Registrieren</button>
    </div>
    <button class="lk" onclick="reset()">Passwort vergessen?</button>
    <div class="err" id="lerr"></div>
    <div class="ok2" id="lok"></div>
  </div>
</div>

<!-- App -->
<div id="app" class="hide">
  <header>
    <h1>Finanzplaner</h1>
    <div class="hr"><button id="th" class="ib" onclick="cycleTheme()" aria-label="Darstellung wechseln">◐</button><select id="cu" onchange="D.cur=this.value;sv();R()"><option>CHF</option><option>EUR</option><option>USD</option><option>GBP</option></select></div>
  </header>
  <div id="bn" class="hide"></div>
  <div id="v"></div>
</div>

</main>
<nav id="nv" class="hide"></nav>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Funktionen -->
<script src="app.js"></script>
</body>
</html>
